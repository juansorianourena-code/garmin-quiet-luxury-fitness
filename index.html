<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA | Quiet Luxury Fitness & Garmin Connect Performance</title>
  <meta name="description" content="Aplicación de rendimiento personal, entrenamiento adaptativo y balance nutricional dinámico conectada con Garmin Connect API. Diseño Quiet Luxury sin modales emergentes." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <script>
    // Auto-bypass Safari / WebKit PWA offline cache
    if (!window.location.search.includes('v=10.0')) {
      window.location.replace(window.location.pathname + '?v=10.0');
    }
  </script>
  
  <!-- Typography Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Quiet Luxury Custom CSS Design System -->
  <link rel="stylesheet" href="css/styles.css?v=10.0" />
</head>
<body>

  <div id="app-container">
    <!-- Top Header -->
    <header class="top-header">
      <div class="top-header-brand">
        <h1 class="brand-title">AURA · PERFORMANCE INSTRUMENT <span style="font-size: 0.65rem; padding: 2px 6px; background: var(--bg-card); border: 1px solid var(--border-line); border-radius: 4px; color: var(--accent-optimal);">v10.0 LIVE</span></h1>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <button id="btn-toggle-account-menu" class="inline-btn inline-btn-secondary" style="padding: 3px 8px; font-size: 0.68rem; font-family: var(--font-mono); font-weight: 600;">
            <span id="header-user-name">JUAN SORIANO</span> · CUENTA
          </button>
          <button id="header-refresh-btn" class="header-refresh-btn" title="Forzar Sincronización & Recarga Total de la App">
            <svg id="header-spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
          <button id="btn-force-hard-reload" class="inline-btn inline-btn-secondary" style="padding: 3px 8px; font-size: 0.68rem; font-family: var(--font-mono); font-weight: 600;">
            RECARGAR
          </button>
          <div class="garmin-badge">
            <span class="garmin-pulse"></span>
            <span id="garmin-badge-text">Garmin Connect Live · Battery 88%</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ACCORDEÓN INLINE DE AUTENTICACIÓN & LOGIN PROPIO (0 MODALES) -->
    <div id="account-menu-accordion" class="accordion-wrapper" style="padding: 0 16px; max-width: 900px; margin: 0 auto;">
      <div class="card" style="margin-top: 10px; margin-bottom: 14px; border: 1px solid var(--border-line-strong); background-color: var(--bg-main);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div class="card-title-sm" style="margin-bottom: 0;">Gestor de Cuenta & Autenticación de Usuario</div>
          <span id="account-status-badge" style="font-size: 0.72rem; font-family: var(--font-mono); color: var(--accent-optimal);">Sesión Activa</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
          <!-- Columna 1: Formulario de Iniciar Sesión / Registro -->
          <div>
            <div style="font-size: 0.78rem; font-weight: 600; text-transform: uppercase; color: var(--text-main); margin-bottom: 8px;">
              Acceder o Crear Cuenta Nueva:
            </div>
            <div class="garmin-field-group" style="margin-bottom: 8px;">
              <label class="garmin-input-label">Nombre Completo:</label>
              <input type="text" id="auth-input-name" placeholder="Ej: Juan Soriano" class="garmin-text-input" style="padding: 6px 10px;" />
            </div>
            <div class="garmin-field-group" style="margin-bottom: 8px;">
              <label class="garmin-input-label">Email / Usuario:</label>
              <input type="email" id="auth-input-email" placeholder="usuario@fitexpert.app" class="garmin-text-input" style="padding: 6px 10px;" />
            </div>
            <div class="garmin-field-group" style="margin-bottom: 12px;">
              <label class="garmin-input-label">Contraseña:</label>
              <input type="password" id="auth-input-pass" placeholder="••••••••" class="garmin-text-input" style="padding: 6px 10px;" />
            </div>

            <div style="display: flex; gap: 8px;">
              <button id="btn-auth-login" class="inline-btn inline-btn-accent" style="padding: 6px 12px; font-size: 0.78rem; flex: 1;">
                Iniciar Sesión
              </button>
              <button id="btn-auth-register" class="inline-btn inline-btn-secondary" style="padding: 6px 12px; font-size: 0.78rem; flex: 1;">
                Registrarse
              </button>
            </div>
            <div id="auth-feedback-msg" style="font-size: 0.75rem; margin-top: 8px; font-weight: 500;"></div>
          </div>

          <!-- Columna 2: Cuentas Registradas en el Dispositivo -->
          <div>
            <div style="font-size: 0.78rem; font-weight: 600; text-transform: uppercase; color: var(--text-main); margin-bottom: 8px;">
              Cuentas Registradas en este Móvil/PC:
            </div>
            <div id="accounts-registered-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto;">
              <!-- Se puebla dinámicamente -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Dynamic Content Area -->
    <main class="content-area">
      <!-- MÓDULO 1: Hub de Control Diario (Dashboard) -->
      <section id="dashboard-module-page" class="module-page active"></section>

      <!-- MÓDULO 2: Entrenamiento Adaptativo y Diario de Fuerza -->
      <section id="workout-module-page" class="module-page"></section>

      <!-- MÓDULO 3: Nutrición y Balance Energético -->
      <section id="nutrition-module-page" class="module-page"></section>

      <!-- MÓDULO 4: Descanso, Salud y Analítica -->
      <section id="analytics-module-page" class="module-page"></section>

      <!-- Garmin Connect API Live Simulator Control Panel (Inline / Discreto) -->
      <div id="garmin-simulator-container"></div>
    </main>

    <!-- Navigation Bar Inferior Fija (4 Módulos) -->
    <nav class="bottom-nav" aria-label="Navegación Principal">
      <!-- Tab 1: Hub -->
      <button class="nav-tab active" data-tab="dashboard" id="nav-dashboard" aria-label="Hub de Control">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Hub</span>
      </button>

      <!-- Tab 2: Entrenamiento -->
      <button class="nav-tab" data-tab="workout" id="nav-workout" aria-label="Entrenamiento">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 7v10M22 7v10"/></svg>
        <span>Entreno</span>
      </button>

      <!-- Tab 3: Nutrición -->
      <button class="nav-tab" data-tab="nutrition" id="nav-nutrition" aria-label="Nutrición">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Nutrición</span>
      </button>

      <!-- Tab 4: Analítica -->
      <button class="nav-tab" data-tab="analytics" id="nav-analytics" aria-label="Analítica y Salud">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Analítica</span>
      </button>
    </nav>
  </div>

  <!-- ES Module Script Entry Point -->
  <script type="module" src="js/app.js?v=10.0"></script>
</body>
</html>
