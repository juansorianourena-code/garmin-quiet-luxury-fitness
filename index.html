<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA | Quiet Luxury Fitness & Garmin Connect Performance</title>
  <meta name="description" content="Aplicación de rendimiento personal, entrenamiento adaptativo y balance nutricional dinámico conectada con Garmin Connect API. Diseño Quiet Luxury sin modales emergentes." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Typography Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Quiet Luxury Custom CSS Design System -->
  <link rel="stylesheet" href="css/styles.css?v=5.0" />
</head>
<body>

  <div id="app-container">
    <!-- Top Header -->
    <header class="top-header">
      <div class="top-header-brand">
        <h1 class="brand-title">AURA · PERFORMANCE INSTRUMENT</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="header-refresh-btn" class="header-refresh-btn" title="Forzar Sincronización con Garmin Connect">
            <svg id="header-spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
          <div class="garmin-badge">
            <span class="garmin-pulse"></span>
            <span id="garmin-badge-text">Garmin Connect Live · Battery 88%</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Content Area -->
    <main class="content-area">
      <!-- MÓDULO 1: Hub de Control Diario (Dashboard) -->
      <section id="dashboard-module-page" class="module-page active"></section>

      <!-- MÓDULO 2: Entrenamiento Adaptativo y Diario de Fuerza -->
      <section id="workout-module-page" class="module-page"></section>

      <!-- MÓDULO 3: Nutrición y Balance Energético -->
      <section id="nutrition-module-page" class="module-page"></section>

      <!-- MÓDULO 4: Descanso, Salud y Analítica -->
      <section id="analytics-module-page" class="module-page"></section>

      <!-- Garmin Connect API Live Simulator Control Panel (Inline / Discreto) -->
      <div id="garmin-simulator-container"></div>
    </main>

    <!-- Navigation Bar Inferior Fija (4 Módulos) -->
    <nav class="bottom-nav" aria-label="Navegación Principal">
      <!-- Tab 1: Hub -->
      <button class="nav-tab active" data-tab="dashboard" id="nav-dashboard" aria-label="Hub de Control">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Hub</span>
      </button>

      <!-- Tab 2: Entrenamiento -->
      <button class="nav-tab" data-tab="workout" id="nav-workout" aria-label="Entrenamiento">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 7v10M22 7v10"/></svg>
        <span>Entreno</span>
      </button>

      <!-- Tab 3: Nutrición -->
      <button class="nav-tab" data-tab="nutrition" id="nav-nutrition" aria-label="Nutrición">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Nutrición</span>
      </button>

      <!-- Tab 4: Analítica -->
      <button class="nav-tab" data-tab="analytics" id="nav-analytics" aria-label="Analítica y Salud">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Analítica</span>
      </button>
    </nav>
  </div>

  <!-- ES Module Script Entry Point -->
  <script type="module" src="js/app.js?v=5.0"></script>
</body>
</html>
